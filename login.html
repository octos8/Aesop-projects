<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · 회원가입 | Aesop</title>
    <link rel="icon" href="./img/favicon.png">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/user-menu.css">
    <script src="./js/account.js" defer></script>
</head>
<body class="account-page">
    <header class="account-header"><a class="account-brand" href="./index.html" aria-label="Aesop 홈">Aēsop</a><a href="./index.html">쇼핑 계속하기</a></header>
    <main class="account-card">
        <h1>로그인</h1>
        <p class="account-intro">로그인하고 더 편리하게 쇼핑해보세요.</p>
        <div class="account-tabs" role="tablist" aria-label="계정 메뉴">
            <button type="button" id="login-tab" role="tab" aria-selected="true" aria-controls="account-panel" data-mode="login">로그인</button>
            <button type="button" id="signup-tab" role="tab" aria-selected="false" aria-controls="account-panel" data-mode="signup">회원가입</button>
        </div>
        <section id="account-panel" role="tabpanel" aria-labelledby="login-tab">
            <form class="account-form">
                <label data-signup hidden>이름<input name="name" autocomplete="name" disabled></label>
                <label>이메일<input type="email" name="email" autocomplete="username" required placeholder="example@email.com"></label>
                <label>비밀번호<input type="password" name="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상 입력해주세요"></label>
                <label data-signup hidden>비밀번호 확인<input type="password" name="confirm" autocomplete="new-password" disabled></label>
                <label data-signup hidden><input type="checkbox" name="consent" disabled> 개인정보 수집 및 이용에 동의합니다.</label>
                <button class="shop-primary" type="submit">로그인</button>
            </form>
            <p class="account-status" role="status">현재 계정 서비스 연결을 준비 중입니다.</p>
        </section>
    </main>
</body>
</html>
