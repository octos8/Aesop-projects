    <!-- 패드 / 모바일용 헤더 -->
    <header class="smart-header">
        <div class="common-frame">
            <!-- 전체 메뉴 열기 -->
            <div class="btn-menu">
                <button type="button" aria-label="전체 메뉴 열기" aria-controls="smart-overlay-menu" aria-expanded="false">
                    <img src="./img/menu.svg" alt="메뉴버튼">
                </button>
            </div>
            <!-- 모바일 로고 -->
            <div class="logo">
                <a href="./index.html">
                    <img src="./img/로고.svg" alt="Aesop 로고">
                </a>
            </div>
            <!-- 모바일 사용자 메뉴 -->
            <div class="lnb">
                <ul class="user-menu">
                    <li>
                        <a href="#">
                            <img src="./img/material-symbols-light_search-rounded.svg" alt="검색하기">

                    </li>
                    <li>
                        <a href="#">
                            <img src="./img/stash_person-light.svg" alt="로그인하기">

                <div class="btn-menu-close">
                    <button type="button" aria-label="전체 메뉴 닫기">
                        <img src="./img/btn-close.svg" alt="닫기이미지">
                    </button>
                </div>
                <!-- 로고 -->
                <div class="logo">
                    <a href="./index.html">
                        <img src="./img/로고.svg" alt="Aesop 로고">

                <!-- 사용자 메뉴 -->
                <div class="lnb">
                    <ul class="user-menu">

                    <li>

                    </li>

                    <section>
                        <h4>
                            <a href="#">지속가능성</a>

                    </section>

                    <section>
                        <h4>
                            <a href="#">저널</a>
                        </h4>
                    </section>

                </div>
            </div>
